<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Marketing Mailer - 24/7 Client Reminders{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    /* Subtle animations */
    .fade-in { animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- Top Navigation Header -->
  <header class="bg-slate-800 border-b border-slate-700/80 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Left: Logo & Title -->
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-blue-500/20">
            ⚡
          </div>
          <div>
            <a href="/" class="text-lg font-bold tracking-tight text-white flex items-center space-x-2">
              <span>Marketing Mailer</span>
              <span class="text-xs bg-slate-700 text-slate-300 font-semibold px-2 py-0.5 rounded">v2.0 Web</span>
            </a>
          </div>
        </div>

        <!-- Center: Desktop Navigation Tabs -->
        <nav class="hidden md:flex items-center space-x-1">
          <a href="/" class="px-3.5 py-2 rounded-lg text-sm font-medium transition-colors {% if active_tab == 'dashboard' %}bg-blue-600 text-white shadow-sm{% else %}text-slate-300 hover:text-white hover:bg-slate-700/60{% endif %}">
            📊 Dashboard
          </a>
          <a href="/clients" class="px-3.5 py-2 rounded-lg text-sm font-medium transition-colors {% if active_tab == 'clients' %}bg-blue-600 text-white shadow-sm{% else %}text-slate-300 hover:text-white hover:bg-slate-700/60{% endif %}">
            👥 Clients
          </a>
          <a href="/template" class="px-3.5 py-2 rounded-lg text-sm font-medium transition-colors {% if active_tab == 'template' %}bg-blue-600 text-white shadow-sm{% else %}text-slate-300 hover:text-white hover:bg-slate-700/60{% endif %}">
            ✉️ Email Template
          </a>
          <a href="/settings" class="px-3.5 py-2 rounded-lg text-sm font-medium transition-colors {% if active_tab == 'settings' %}bg-blue-600 text-white shadow-sm{% else %}text-slate-300 hover:text-white hover:bg-slate-700/60{% endif %}">
            ⚙️ Settings
          </a>
        </nav>

        <!-- Right: Actions & Profile -->
        <div class="flex items-center space-x-3">
          <!-- Theme Toggle -->
          <button id="themeToggle" class="p-2 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-700/60 transition-colors" title="Toggle Light/Dark Theme">
            <span id="themeIcon">🌙</span>
          </button>

          <!-- Logout -->
          <a href="/logout" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-red-600 hover:text-white text-slate-300 transition-colors">
            Logout
          </a>

          <!-- Mobile Menu Button -->
          <button id="mobileMenuBtn" class="md:hidden p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
        </div>

      </div>
    </div>

    <!-- Mobile Nav Menu (Hidden by default) -->
    <div id="mobileMenu" class="md:hidden hidden border-t border-slate-700 bg-slate-800 px-4 pt-2 pb-4 space-y-1">
      <a href="/" class="block px-3 py-2 rounded-md text-base font-medium {% if active_tab == 'dashboard' %}bg-blue-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">📊 Dashboard</a>
      <a href="/clients" class="block px-3 py-2 rounded-md text-base font-medium {% if active_tab == 'clients' %}bg-blue-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">👥 Clients</a>
      <a href="/template" class="block px-3 py-2 rounded-md text-base font-medium {% if active_tab == 'template' %}bg-blue-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">✉️ Email Template</a>
      <a href="/settings" class="block px-3 py-2 rounded-md text-base font-medium {% if active_tab == 'settings' %}bg-blue-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">⚙️ Settings</a>
    </div>
  </header>

  <!-- Main Body Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Theme Toggle & Toast Notification Script -->
  <script>
    // Universal Toast Notification
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto fade-in flex items-center space-x-2.5 px-4 py-3 rounded-xl shadow-xl text-sm font-medium border ${
        type === 'success' ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200' :
        type === 'error' ? 'bg-red-950/90 border-red-500/50 text-red-200' :
        'bg-slate-800/95 border-slate-600 text-slate-100'
      }`;
      const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
      toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.transition = 'opacity 0.3s, transform 0.3s';
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    const themeBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const htmlEl = document.documentElement;

    // Load saved preference
    if (localStorage.getItem('theme') === 'light') {
      htmlEl.classList.remove('dark');
      document.body.classList.remove('bg-slate-900', 'text-slate-100');
      document.body.classList.add('bg-slate-100', 'text-slate-900');
      themeIcon.textContent = '☀️';
    }

    themeBtn.addEventListener('click', () => {
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        document.body.classList.remove('bg-slate-900', 'text-slate-100');
        document.body.classList.add('bg-slate-100', 'text-slate-900');
        themeIcon.textContent = '☀️';
        localStorage.setItem('theme', 'light');
      } else {
        htmlEl.classList.add('dark');
        document.body.classList.remove('bg-slate-100', 'text-slate-900');
        document.body.classList.add('bg-slate-900', 'text-slate-100');
        themeIcon.textContent = '🌙';
        localStorage.setItem('theme', 'dark');
      }
    });

    // Mobile menu toggle
    const mobBtn = document.getElementById('mobileMenuBtn');
    const mobMenu = document.getElementById('mobileMenu');
    if (mobBtn && mobMenu) {
      mobBtn.addEventListener('click', () => {
        mobMenu.classList.toggle('hidden');
      });
    }
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
