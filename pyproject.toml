[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-mail-system"
version = "2.0.0"
authors = [
  { name = "Sagar Biswas", email = "192402369+SagarBiswas-MultiHAT@users.noreply.github.com" },
]
description = "24/7 automated client work reminder and marketing SMTP mail system with rolling 24-hour rate limiting and Webmail support."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
keywords = [
  "smtp",
  "webmail",
  "marketing",
  "client-reminder",
  "email-automation",
  "daemon",
  "rate-limiting",
  "cpanel",
  "work-reminder"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Customer Service",
  "Topic :: Communications :: Email",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent"
]

[project.scripts]
marketing-mailer = "main:main"
