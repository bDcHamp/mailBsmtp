# ==============================================================================
# Nginx Reverse Proxy Configuration for Marketing Mailer
# Place in: /etc/nginx/sites-available/marketing-mailer.conf
# Symlink to: /etc/nginx/sites-enabled/marketing-mailer.conf
# ==============================================================================

server {
    listen 80;
    listen [::]:80;

    # Replace with your custom domain or subdomain
    server_name reminders.youragency.com;

    # Maximum upload size for client CSV files
    client_max_body_size 16M;

    location / {
        # Forward traffic to Marketing Mailer Web Server (default port: 8085)
        proxy_pass http://127.0.0.1:8085;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for continuous streaming & long-running Webmail checks
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Support for real-time polling / WebSocket upgrades
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ==============================================================================
# SSL Setup with Let's Encrypt Certbot:
# 1. sudo ln -s /etc/nginx/sites-available/marketing-mailer.conf /etc/nginx/sites-enabled/
# 2. sudo nginx -t
# 3. sudo systemctl reload nginx
# 4. sudo certbot --nginx -d reminders.youragency.com
# ==============================================================================

